{{HEAD}}
<body>
<main class="page sd">
  <div class="draft" data-borrador hidden>Borrador · hay datos de ejemplo</div>
  <p class="eyebrow">Reserva la fecha</p>
  <h1 class="titulo"><span data-bind="n1"></span> <span class="amp">&amp;</span> <span data-bind="n2"></span></h1>

  <div class="carta" id="raspa">
    <img class="foto" src="img/foto-600.webp" srcset="img/foto-600.webp 600w, img/foto-1000.webp 1000w" sizes="(max-width: 480px) 90vw, 420px" alt="Valentina y Sebastián abrazados al anochecer bajo las primeras estrellas" width="1000" height="1250" fetchpriority="high">
    <div class="fecha-sobre"><b data-bind="dia"></b><span data-bind="mes-nombre"></span><i data-bind="anio"></i></div>
    <canvas id="lamina" class="lamina" aria-hidden="true"></canvas>
  </div>
  <p class="pista" id="pista">Rasca con el dedo para descubrir la fecha</p>
  <button class="btn" id="mostrar" type="button">Descubrir sin rascar</button>

  <section class="revela" id="revela" hidden>
    <p class="fecha-l" data-bind="fecha-larga"></p>
    <p class="mini">Faltan</p>
    {{CUENTA}}
    <p class="ciudad" data-bind="cer-ciudad"></p>
    <button class="btn solid" data-ics type="button">Añadir al calendario</button>
    <p class="mini">Pronto recibirás la invitación completa.</p>
  </section>
</main>
{{FOOT}}
