{{HEAD}}
<body>
<main class="page">
  <header class="hero">
    <div class="draft" data-borrador hidden>Borrador · hay datos de ejemplo</div>
    <div class="marco">
      <img src="img/marco.webp" alt="" aria-hidden="true" width="900" height="1117" fetchpriority="high">
      <div class="marco-t">
        <p class="a">Nos casamos</p>
        <h1><span data-bind="n1"></span><span class="amp">&amp;</span><span data-bind="n2"></span></h1>
        <p class="b" data-bind="fecha-punto"></p>
      </div>
    </div>
  </header>

  <section class="sec invita">
    <p class="rv cita" data-invita></p>
  </section>

  <div class="cenefa" role="presentation"></div>

  <section class="sec cuenta" aria-label="Cuenta atrás">
    {{CUENTA}}
  </section>

  <section class="sec evento">
    <h2 class="rv">Ceremonia</h2>
    <p class="rv h" data-bind="cer-hora"></p>
    <p class="rv l" data-bind="cer-nombre"></p>
    <p class="rv" data-bind="cer-ciudad"></p>
    <a class="btn rv" data-mapa="cer" href="#">Ver detalles</a>
  </section>
  <div class="cenefa fina" role="presentation"></div>
  <section class="sec evento">
    <h2 class="rv">Recepción</h2>
    <p class="rv h" data-bind="rec-hora"></p>
    <p class="rv l" data-bind="rec-nombre"></p>
    <p class="rv" data-bind="rec-ciudad"></p>
    <a class="btn rv" data-mapa="rec" href="#">Ver detalles</a>
  </section>

  <figure class="arco rv">
    <img src="img/foto-600.webp" srcset="img/foto-600.webp 600w, img/foto-1000.webp 1000w" sizes="(max-width: 480px) 80vw, 380px" alt="Valentina y Sebastián riendo y abrazados en un patio andaluz con azulejos" width="1000" height="664" loading="lazy">
  </figure>

  <section class="sec programa" aria-labelledby="progT">
    <h2 id="progT" class="rv">El día de la boda</h2>
    <ol data-programa class="linea"></ol>
  </section>

  <section class="sec hash">
    <h2 class="rv">Comparte el amor</h2>
    <p class="rv">Súbanlas a sus redes con nuestro hashtag.</p>
    <button class="btn solid rv" data-hashtag-btn type="button"></button>
    <p class="mini" data-hashtag-estado role="status" aria-live="polite"></p>
  </section>

  <section class="sec rsvp" id="confirmar" aria-labelledby="rsvpT">
    <h2 id="rsvpT" class="rv">Confirma tu asistencia</h2>
    <p class="rv" data-limite></p>
    {{FORM}}
    <button class="btn rv" data-ics type="button">Añadir al calendario</button>
  </section>

  <footer class="cierre">
    <p class="firma"><span data-bind="n1"></span> &amp; <span data-bind="n2"></span></p>
    <div class="cenefa" role="presentation"></div>
  </footer>
</main>
{{FOOT}}
