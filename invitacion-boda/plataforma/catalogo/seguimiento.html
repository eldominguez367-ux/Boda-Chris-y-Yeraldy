<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguir mi pedido · Eterna</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5C1F3A">
<link rel="stylesheet" href="catalogo.css">
</head>
<body data-pagina="seguimiento">
<div class="promo" id="promo"><span>Entrega en 48 horas · Cambios incluidos · Pago único, sin suscripciones</span><button type="button" id="promoX" aria-label="Cerrar aviso">×</button></div>
<header class="cab" id="cab">
  <div class="caja cab-in">
    <a href="index.html" class="logo" data-marca>Eterna</a>
    <nav aria-label="Principal"><a href="index.html#disenos">Diseños</a><a href="index.html#savethedate">Save the Date</a><a href="index.html#planes">Planes y precios</a><a href="index.html#planificador">Planificador</a><a href="index.html#como">Cómo funciona</a><a href="index.html#faq">Preguntas</a></nav>
    <div class="cab-der"><a class="link" id="cabWa" href="#" target="_blank" rel="noopener">Escríbenos</a><button class="btn solid" type="button" data-pedido>Empezar</button><button class="burger" id="burger" type="button" aria-label="Menú" aria-expanded="false"><i></i><i></i></button></div>
  </div>
</header>

<main class="caja angosta seg" id="contenido">
  <p class="eyebrow">Seguimiento</p>
  <h1 class="seg-t">¿En qué punto está tu invitación?</h1>
  <form id="fSeg" class="seg-form" novalidate>
    <label for="sCod" class="sr-only">Código de pedido</label>
    <input id="sCod" placeholder="Tu código, por ejemplo ET-7K2M9" autocomplete="off" autocapitalize="characters" aria-describedby="sMsg">
    <button class="btn solid" type="submit">Ver mi pedido</button>
  </form>
  <p class="peq" id="sMsg" role="status" aria-live="polite">Escribe el código que recibiste al hacer el pedido. Para ver un ejemplo, prueba con <button class="btn enlace" type="button" id="verDemo">DEMO</button>.</p>
  <div id="sRes"></div>
</main>

<script src="config.js"></script>
<script src="datos-catalogo.js"></script>
<script src="catalogo.js"></script>
<script src="seguimiento.js"></script>
</body>
</html>
