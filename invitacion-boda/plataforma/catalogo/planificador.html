<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planificador de boda · Eterna</title>
<meta name="description" content="Lleva tus invitados, tu presupuesto y tus tareas en un solo sitio, desde el móvil, sin cuenta.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5C1F3A">
<link rel="stylesheet" href="catalogo.css">
<link rel="stylesheet" href="planificador.css">
</head>
<body class="plan-app">
<div id="app">
  <header class="p-cab">
    <a class="logo" href="index.html" data-marca>Eterna</a>
    <span class="p-tit">Planificador</span>
    <a class="p-volver" href="index.html" id="volver">← Volver a la web</a>
  </header>
  <div class="p-cuerpo">
    <nav class="p-nav" id="nav" aria-label="Secciones del planificador" hidden>
      <button type="button" data-v="resumen" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg><span>Resumen</span></button>
      <button type="button" data-v="invitados"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5M16 5.5a3 3 0 010 5.8M18 14.8c2 .6 3.5 2.2 3.5 5.2"/></svg><span>Invitados</span></button>
      <button type="button" data-v="presupuesto"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M15 15h3"/></svg><span>Presupuesto</span></button>
      <button type="button" data-v="tareas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg><span>Tareas</span></button>
      <button type="button" data-v="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span>Ajustes</span></button>
    </nav>
    <main class="p-main" id="vista" aria-live="polite"></main>
  </div>
</div>
<script src="config.js"></script>
<script src="planificador.js"></script>
</body>
</html>
